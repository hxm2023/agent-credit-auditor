name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (frozen lock)
        run: uv sync --extra dev --frozen

      - name: Lint (ruff, E/F/W/I gate)
        run: uv run ruff check src/ tests/ stage3/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tests/ stage3/

      - name: Type check (pyright, strict on src)
        run: uv run pyright src/

      - name: Dependency audit
        run: uv audit || true  # informational until the lock is fully auditable

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (frozen lock)
        run: uv sync --extra dev --frozen

      - name: Validate all frozen protocols
        run: |
          for p in configs/protocols/*.json; do
            uv run credit-auditor validate-protocol "$p"
          done

      - name: Release gate — every checked-in artifact pack passes the Auditor
        run: bash scripts/validate_artifacts.sh

      - name: Smoke tests (fast, excludes full-driver pipelines)
        run: uv run pytest -m "not full" -q

      - name: Fresh-clone reproduction (M0 pack via script)
        run: bash scripts/run_m0.sh artifacts/ci/M0

      - name: Full test suite + coverage (release gate, >= 85%)
        run: uv run pytest --cov=credit_auditor --cov-fail-under=85 -q

      - name: Guard + legacy bundle CLI smoke
        run: |
          echo '{"schema_version": "grpo-guard-envelope-1.0", "required_extensions": [], "content_sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' > /tmp/env.json
          uv run credit-auditor validate-guard-envelope --envelope /tmp/env.json
