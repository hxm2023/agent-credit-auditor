[project]
name = "credit-auditor"
version = "0.1.3"
description = "Agent-RL Credit Auditor: CPU-first audit & exact benchmark for credit estimators in agent RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Design §25: the guard extra pins the GRPO-Guard core schema major/minor.
# The pinned version lives in src/credit_auditor/adapters/grpo_guard_envelope.py
# (GUARD_SCHEMA = grpo-guard-envelope-1.0); the extra stays empty until the
# Guard schema package is published — unknown majors are rejected fail-closed.
guard = []

[project.scripts]
credit-auditor = "credit_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "release_report: release-report builder tests (excluded from nested TEST_LOG runs)",
    "full: slow pipeline tests (M0/V001/D002/CONT/ML full-driver runs); exclude with -m 'not full' for the fast smoke set",
    "smoke: fast tests (unit + fault + protocol), the default for day-to-day development",
]
