[project]
name = "credit-auditor"
version = "0.1.1"
description = "Agent-RL Credit Auditor: CPU-first audit & exact benchmark for credit estimators in agent RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
credit-auditor = "credit_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "release_report: release-report builder tests (excluded from nested TEST_LOG runs)",
]
