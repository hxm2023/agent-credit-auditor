[project]
name = "credit-auditor"
version = "0.1.6"
description = "Agent-RL Credit Auditor: CPU-first audit & exact benchmark for credit estimators in agent RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# Design §25: the guard extra pins the GRPO-Guard core schema major/minor.
# The pinned version lives in src/credit_auditor/adapters/grpo_guard_envelope.py
# (GUARD_SCHEMA = grpo-guard-envelope-1.0); the extra stays empty until the
# Guard schema package is published — unknown majors are rejected fail-closed.
guard = []

[project.scripts]
credit-auditor = "credit_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_auditor"]

[tool.hatch.build.targets.sdist]
# publish only the distributable surface: package + metadata + docs that
# belong in the release; internal working docs stay out of the artifact.
include = [
    "src/credit_auditor",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "release_report: release-report builder tests (excluded from nested TEST_LOG runs)",
    "full: slow pipeline tests (M0/V001/D002/CONT/ML full-driver runs); exclude with -m 'not full' for the fast smoke set",
    "smoke: fast tests (unit + fault + protocol), the default for day-to-day development",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # CI gate: hard correctness + import order
# E501 (line length) is delegated to `ruff format`; F-codes are the gate.
per-file-ignores = { "*.py" = ["E501"] }
# dev hint: run `uv run ruff check --select E,F,W,I,B,UP,SIM .` to see suggestions

[tool.pyright]
pythonVersion = "3.10"
include = ["src"]
reportMissingImports = true
reportUnusedImport = true
# Pydantic v2 accepts dicts for model args (runtime-validated); pyright does
# not model this. The horizon-method-vs-dataclass-attribute override is a
# design tradeoff (ExactWorld protocol vs dataclass fields). Both are gated
# out; the remaining checks stay strict.
reportArgumentType = false
reportIncompatibleMethodOverride = false

[tool.coverage.run]
source = ["credit_auditor"]
omit = ["*/tests/*", "*/oracles/*"]  # oracle scripts run in subprocesses and are
# verified by exact alignment tests (==0), not by in-process coverage

[tool.coverage.report]
fail_under = 85
show_missing = true
